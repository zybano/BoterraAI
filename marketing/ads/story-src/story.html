  .abs { position: absolute; will-change: transform, opacity; }
  .fred { font-family: "Fredoka", sans-serif; }
  .city { left: 70px; top: 120px; padding: 14px 28px; border-radius: 999px; font-size: 34px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
  .biz { left: 70px; top: 200px; font-family: "Fredoka"; font-weight: 700; font-size: 92px; line-height: 1; }
  .tag { padding: 12px 28px; border-radius: 999px; font-size: 34px; font-weight: 800; color: #fff; }
  .bubble { left: 60px; top: 1480px; width: 960px; background: #FFFDF8; border-radius: 52px; padding: 44px 52px; font-size: 52px; font-weight: 800; line-height: 1.25; box-shadow: 0 18px 0 rgba(31,27,46,.18); }
  .bubble .w { opacity: .14; transition: none; }
  .bubble .w.on { opacity: 1; }
  .tail { position: absolute; top: -26px; width: 60px; height: 60px; background: #FFFDF8; transform: rotate(45deg); border-radius: 10px; }
  .card { background: #FFFDF8; border-radius: 34px; padding: 26px 30px; box-shadow: 0 14px 0 rgba(31,27,46,.16); display: flex; align-items: center; gap: 22px; font-size: 36px; font-weight: 800; width: 560px; }
  .ava { width: 78px; height: 78px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-family: "Fredoka"; font-weight: 700; font-size: 40px; flex: none; }
  .small { font-size: 28px; font-weight: 700; color: #6B6478; }
  .ok { margin-left: auto; width: 60px; height: 60px; border-radius: 50%; background: #1DB980; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 36px; flex: none; }
  .bad { background: #E8453C; color: #fff; padding: 8px 18px; border-radius: 12px; font-size: 28px; font-weight: 800; transform: rotate(-6deg); }
  .narr { left: 0; width: 1080px; text-align: center; font-family: "Fredoka"; font-weight: 700; line-height: 1.05; }
</style></head>

function pose(el, { t, mood = 0, talk = 0, seed = 0 }) {
  // mood: 0 worried → 1 happy. talk: 0..1 mouth amplitude.
  const bob = Math.sin(t * 2.2 + seed) * 6 + talk * 4;
  el.querySelector(".bob").setAttribute("transform", `translate(0 ${bob.toFixed(2)})`);
  el.querySelector(".headg").setAttribute("transform", `rotate(${(Math.sin(t * 1.3 + seed) * 2 + talk * 3 * Math.sin(t * 9)).toFixed(2)} 300 420)`);
  const blinkPhase = (t + seed * 1.7) % 3.4;
  const blink = blinkPhase < 0.12 ? 0.1 : 1;
  el.querySelector(".eyes").setAttribute("transform", `translate(0 ${368 * (1 - blink)}) scale(1 ${blink})`);
  const lerp = (a, b) => a + (b - a) * mood;
  el.querySelector(".browL").setAttribute("d", `M222 ${lerp(332, 322)} Q247 ${lerp(326, 306)} 272 ${lerp(312, 318)}`);
  el.querySelector(".browR").setAttribute("d", `M328 ${lerp(312, 318)} Q353 ${lerp(326, 306)} 378 ${lerp(332, 322)}`);
  el.querySelector(".mouthLine").setAttribute("d", `M266 ${lerp(458, 440)} Q300 ${lerp(436, 474)} 334 ${lerp(458, 440)}`);
  el.querySelector(".mouthLine").style.opacity = talk > 0.04 ? 0 : 1;
  const mo = el.querySelector(".mouthOpen");
  mo.setAttribute("ry", (4 + talk * 24).toFixed(1)); mo.style.opacity = talk > 0.04 ? 1 : 0;
  el.querySelector(".blush").setAttribute("opacity", (mood * 0.9).toFixed(2));
}

// ---------- build scenes ----------
const stage = document.getElementById("stage");
function scene(id, html, bg = "") { const d = document.createElement("div"); d.className = "scene"; d.id = id; d.style.background = bg; d.innerHTML = html; stage.appendChild(d); return d; }
function bubble(id, text, color, tailX) {
  const words = text.split(" ").map(w => `<span class="w">${w}</span>`).join(" ");
  return `<div id="${id}" class="abs bubble"><div class="tail" style="left:${tailX}px"></div>${words}</div>`;
}

};

function personScene(id, who, text, overlays) {
  const p = PEOPLE[who];
  return scene(id, `${p.bg}
    <div class="abs city" style="background:${p.dark === "#FFFFFF" ? "#FFFFFF" : "#1F1B2E"};color:${p.dark === "#FFFFFF" ? "#4A2272" : "#FFFFFF"}">${p.city}</div>

    ${bubble(id + "-b", text, p.color, 470)}`);
}

  // 5-7 solutions
  personScene("s5", "amaka", texts[5], `

  personScene("s6", "kofi", texts[6], `

    <div id="s6o1" class="abs card" style="left:470px;top:520px"><div>Invoice #208<div class="small" id="s6pay">Approve reminder?</div></div><div id="s6btn" style="margin-left:auto;padding:14px 26px;border-radius:999px;background:#F2B33D;font-size:30px">Approve</div></div>`);
  personScene("s7", "wanjiru", texts[7], `
    <div id="s7o0" class="abs card" style="left:470px;top:360px"><div class="ava" style="background:#FBE1DE;color:#9B2B1F">S</div><div>Sentinel<div class="small">Licence renewal filed</div></div><div class="ok">✓</div></div>
    <div id="s7o1" class="abs card" style="left:470px;top:520px"><div class="ava" style="background:#FFF1D0;color:#80570A">📅</div><div>All deadlines<div class="small">tracked for the year</div></div><div class="ok">✓</div></div>`);
  // 8 the team
  const AG = ["Atlas","Vision","Pulse","Ledger","Quinn","Tally","Levy","Flow","Stock","Vendor","Nova","Echo","Hunter","Scribe","Rank","Haven","Loyal","Harper","Penny","Lex","Mark","Sentinel","Shield","Ada","Docket","Byte"];
  const COLS = ["#34D3A6","#F2B33D","#FF6F91","#7B8CFF","#FF8A4C","#5FD6C2","#B7A2F2"];
  scene("s8", `<div class="abs" style="inset:0;background:#0B1424"></div>
    <div id="s8t" class="abs narr" style="top:180px;font-size:110px;color:#F6F8F4"><span id="s8n" style="color:#34D3A6">26</span> AI agents</div>
    <div id="s8s" class="abs narr" style="top:320px;font-size:46px;color:#BFD8D0;font-family:Nunito;font-weight:800">finance · operations · sales · HR · legal · compliance</div>
    ${AG.map((a,i)=>`<div id="s8a${i}" class="abs" style="left:${70 + (i%5)*190}px;top:${470 + Math.floor(i/5)*175}px;width:180px;text-align:center"><div style="width:110px;height:110px;margin:0 auto;border-radius:32px;background:${COLS[i%7]};display:flex;align-items:center;justify-content:center;font-family:Fredoka;font-weight:700;font-size:56px;color:#0B1424">${a[0]}</div><div style="color:#F6F8F4;font-size:28px;font-weight:800;margin-top:8px">${a}</div></div>`).join("")}

  // 9 trio
  scene("s9", `<div class="abs" style="inset:0;background:linear-gradient(180deg,#FFE3A3,#FFB36B)"></div><div class="abs" style="left:0;top:1370px;width:1080px;height:550px;background:#E8743B"></div><div class="abs" style="left:0;top:1350px;width:1080px;height:40px;border-radius:10px;background:#F39A5E"></div>
    <div id="s9t" class="abs narr" style="top:220px;font-size:100px">Three businesses.<br><span style="color:#0B7A5C">One AI workforce.</span></div>
    ${["amaka","kofi","wanjiru"].map((w,i)=>`<div id="s9p${i}" class="abs" style="left:${[-40,330,700][i]}px;top:${[820,800,820][i]}px">${charSVG(w, "s9c"+i, 420)}</div>`).join("")}

  // 10 end
  scene("s10", `<div class="abs" style="inset:0;background:radial-gradient(circle at 50% 35%, #12634F 0%, #0B1424 72%)"></div>
    <div id="e1" class="abs" style="left:420px;top:400px;width:240px;height:240px;border-radius:64px;background:linear-gradient(135deg,#34D3A6,#04785E);box-shadow:0 0 140px rgba(52,211,166,.5)"><svg viewBox="0 0 32 32" width="240" height="240"><circle cx="16" cy="16" r="4" fill="#fff"/><circle cx="8.5" cy="9" r="2.2" fill="#fff" opacity=".85"/><circle cx="23.5" cy="9" r="2.2" fill="#fff" opacity=".85"/><circle cx="8.5" cy="23" r="2.2" fill="#fff" opacity=".85"/><circle cx="23.5" cy="23" r="2.2" fill="#fbbf24"/><path d="M10 10.5 14 14M22 10.5 18 14M10 21.5 14 18M22 21.5 18 18" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".7"/></svg></div>

};

// ---------- animation ----------
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function set(el, o, x = 0, y = 0, s = 1, extra = "") { if (!el) return; el.style.opacity = o; el.style.transform = `translate(${x}px,${y}px) scale(${s}) ${extra}`; }
const pop = (el, t, a, dur = 0.35) => { const p = seg(t, a, a + dur); set(el, Math.min(1, p * 2), 0, 0, 0.4 + 0.6 * back(p)); };
const rise = (el, t, a, dist = 60) => { const p = ease(seg(t, a, a + 0.4)); set(el, p, 0, dist * (1 - p)); };

window.render = function (t) {
  const { starts: S, durs: D, env: ENV, total: TOTAL } = window.TL;
  const amp = (i) => { const k = Math.floor((t - S[i]) * 30); const e = ENV[i]; return k >= 0 && k < e.length ? Math.min(1, e[k] * 1.3) : 0; };
  const sceneStart = S.map((s, i) => i === 0 ? 0 : s - 0.2);
  // Scene visibility + circular wipe in
  for (let i = 0; i <= 10; i++) {
    const el = $("s" + i);
    const a = sceneStart[i], next = i < 10 ? sceneStart[i + 1] + 0.5 : TOTAL + 1;
    const vis = t >= a && t < next;
    el.style.visibility = vis ? "visible" : "hidden";
    if (vis) {
      const p = i === 0 ? 1 : ease(seg(t, a, a + 0.5));
      el.style.clipPath = p >= 1 ? "none" : `circle(${(p * 1250).toFixed(0)}px at 540px 960px)`;
    }
  }
  const words = (id, i) => { const b = $(id); if (!b) return; const ws = b.querySelectorAll(".w"); ws.forEach((w, k) => w.classList.toggle("on", t >= S[i] + D[i] * (k / ws.length) * 0.92)); };

  // 0 intro
  $("rays").setAttribute("transform", `rotate(${t * 6} 540 760)`);
  rise($("s0t"), t, 0.2);
  [0, 1, 2].forEach(i => { pop($("s0p" + i), t, 1.0 + i * 0.6); pose($("s0c" + i), { t, mood: 0.7, seed: i }); });

  // 1-3 problems, 5-7 solutions
  const people = { 1: "amaka", 2: "kofi", 3: "wanjiru", 5: "amaka", 6: "kofi", 7: "wanjiru" };
  for (const [k, who] of Object.entries(people)) {
    const i = Number(k), sid = "s" + i, solved = i >= 5;
    pose($(sid + "-c"), { t, mood: solved ? Math.min(1, 0.4 + seg(t, S[i], S[i] + 1.2)) : 0.05, talk: amp(i), seed: i });
    $(sid).querySelector(".charwrap").style.transform = `translateY(${(1 - ease(seg(t, S[i] - 0.2, S[i] + 0.4))) * 120}px)`;
    rise($(sid).querySelector(".city"), t, S[i] - 0.1, 30);
    rise($(sid).querySelector(".biz"), t, S[i] + 0.05, 30);
    rise($(sid).querySelector(".tag"), t, S[i] + 0.15, 30);
    rise($(sid + "-b"), t, S[i] + 0.1, 80);
    words(sid + "-b", i);
  }
  // problem props jitter in
  [["s1o0", 1.2], ["s1o1", 2.0], ["s1o2", 3.0]].forEach(([id, o], n) => { pop($(id), t, S[1] + o); const el = $(id); if (el) el.style.transform += ` rotate(${Math.sin(t * 3 + n) * 4}deg)`; });
  [["s2o0", 2.6], ["s2o1", 3.4]].forEach(([id, o], n) => { pop($(id), t, S[2] + o); $(id).style.transform += ` rotate(${(n ? 5 : -5) + Math.sin(t * 4 + n) * 2}deg)`; });
  pop($("s3o0"), t, S[3] + 1.8); $("s3o0").style.transform += ` rotate(${4 + Math.sin(t * 5) * 2}deg)`;
  const steam = document.querySelectorAll(".steam"); steam.forEach(s => s.setAttribute("transform", `translate(0 ${-((t * 40) % 60)})`));
  // solution cards
  pop($("s5o0"), t, S[5] + 0.3); pop($("s5o1"), t, S[5] + 2.4);
  pop($("s6o0"), t, S[6] + 0.3); pop($("s6o1"), t, S[6] + 1.6);
  const paid = t >= S[6] + 2.6;
  $("s6btn").textContent = paid ? "Paid ✓" : "Approve"; $("s6btn").style.background = paid ? "#1DB980" : "#F2B33D"; $("s6btn").style.color = paid ? "#fff" : "#1F1B2E";
  $("s6pay").textContent = paid ? "Payment received" : "Approve reminder?";
  pop($("s7o0"), t, S[7] + 0.4); pop($("s7o1"), t, S[7] + 2.6);

  // 4 brand
  rise($("s4t"), t, S[4] + 0.1);
  const lp = seg(t, S[4] + 2.4, S[4] + 2.9);
  set($("s4logo"), Math.min(1, lp * 2), 0, 0, back(lp), `rotate(${-120 * (1 - ease(lp))}deg)`);
  pop($("s4b"), t, S[4] + 3.4, 0.45);

  // 8 team
  rise($("s8t"), t, S[8] + 0.1); rise($("s8s"), t, S[8] + 2.8, 30);
  $("s8n").textContent = Math.round(26 * ease(seg(t, S[8] + 0.2, S[8] + 1.4)));
  for (let i = 0; i < 26; i++) pop($("s8a" + i), t, S[8] + 0.3 + i * 0.08, 0.3);
  pop($("s8ok"), t, S[8] + 5.4, 0.4);

  // 9 trio
  rise($("s9t"), t, S[9]);
  [0, 1, 2].forEach(i => { const p = ease(seg(t, S[9] + 0.3 + i * 0.25, S[9] + 0.8 + i * 0.25)); $("s9p" + i).style.transform = `translateY(${(1 - p) * 500}px)`; pose($("s9c" + i), { t, mood: 1, seed: i * 2 }); pop($("s9l" + i), t, S[9] + 1.0 + i * 0.25); });

  // 10 end
  const ep = seg(t, S[10] - 0.1, S[10] + 0.4);
  set($("e1"), Math.min(1, ep * 2), 0, 0, back(ep), `rotate(${-90 * (1 - ease(ep))}deg)`);
  rise($("e2"), t, S[10] + 0.15); rise($("e3"), t, S[10] + 0.4, 30);
  const up = seg(t, S[10] + 1.3, S[10] + 1.7);
  set($("e4"), ease(up), 0, 0, (0.8 + 0.2 * back(up)) * (1 + 0.025 * Math.sin((t - S[10]) * 6) * seg(t, S[10] + 1.8, S[10] + 2)));
  rise($("e5"), t, S[10] + 1.9, 30); rise($("e6"), t, S[10] + 2.2, 10);
};
